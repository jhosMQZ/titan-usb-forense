# Configuracion de freshclam para el USB forense (la usa Actualizar-Firmas.ps1).
# La carpeta de la base se pasa con --datadir.
DatabaseMirror database.clamav.net
# Descargar bases COMPLETAS (.cvd) firmadas digitalmente por Cisco Talos,
# en lugar de parches incrementales (.cld sin firma verificable).
ScriptedUpdates no
CompressLocalDatabase no
LogTime yes
ConnectTimeout 60
ReceiveTimeout 0
